services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clyra
      POSTGRES_USER: clyra
      POSTGRES_PASSWORD: clyra
    ports:
      - "5432:5432"
    volumes:
      - clyra-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://clyra:clyra@postgres:5432/clyra
      REDIS_URL: redis://redis:6379/0
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
volumes:
  clyra-postgres:
